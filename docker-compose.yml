x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:

  # ─── Backend ───────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
      - minio
      - artefactik0
      - sqlservice
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codzilla
      DB_USERNAME: myuser
      DB_PASSWORD: secret
      JUDGE0_BASE_URL: http://judge0-server:2358
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio-user
      S3_PASSWORD: minio-password
      S3_REGION: us-east-1
      S3_BUCKET_NAME: codzilla
      ARTEFACTIK0_BASE_URL: http://artefactik0:8081
      SQLSERVICE_BASE_URL: http://sqlservice:8082
    <<: *default-logging
    restart: always

  # ─── Frontend ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # ─── Backend DB ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    ports:
      - "5435:5432"  # Изменено на 5435, чтобы избежать конфликта с локальным Postgres
    environment:
      POSTGRES_DB: codzilla
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    volumes:
      - app-data:/var/lib/postgresql/data
    restart: always

  # ─── Artefactik0 DB ────────────────────────────────────────────
  postgres-artefactik:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: artefaktikdb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    volumes:
      - artefactik-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d artefaktikdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── SqlService DB ─────────────────────────────────────────────
  postgres-sql:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: sqlservicedb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    volumes:
      - sqlservice-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d sqlservicedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Artefactik0 ───────────────────────────────────────────────
  artefactik0:
    build: ./services/artefactik0
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-artefactik:5432/artefaktikdb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      postgres-artefactik:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always

  # ─── SqlService ────────────────────────────────────────────────
  sqlservice:
    build: ./services/sqlservice
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-sql:5432/sqlservicedb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      postgres-sql:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    restart: always

  # ─── Kafka ─────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    <<: *default-logging
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    <<: *default-logging
    restart: always

  # ─── MinIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: always

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minio-user minio-password;
        mc mb --ignore-existing local/codzilla;
        mc mb --ignore-existing local/artefactik0-tasks;
        mc mb --ignore-existing local/sqlservice-tasks;
        echo 'All buckets ready';
      "
    restart: on-failure

volumes:
  app-data:
  judge0-data:
  minio-data:
  artefactik-data:
  sqlservice-data:
