x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - judge0-server
      - kafka
      - minio
      - artefactik0          # ← добавили
      - sqlservice           # ← добавили
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codzilla
      DB_USERNAME: user
      DB_PASSWORD: password
      # УДАЛЕНО:
      # POLYGON_KEY: ${POLYGON_KEY}
      # POLYGON_SECRET: ${POLYGON_SECRET}
      # POLYGON_API_URL: https://polygon.codeforces.com/api/
      # ДОБАВЛЕНО:
      ARTEFACTIK0_BASE_URL: http://artefactik0:8081
      SQLSERVICE_BASE_URL: http://sqlservice:8080
      JUDGE0_BASE_URL: http://judge0-server:2358
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio-user
      S3_PASSWORD: minio-password
      S3_REGION: us-east-1
      S3_BUCKET_NAME: codzilla

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: codzilla
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - app-data:/var/lib/postgresql/data

  # ---------- Базы данных для Artefactik0 и SqlService ----------
  postgres-artefactik:
    image: postgres:15
    environment:
      POSTGRES_DB: artefactikdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - artefactik-data:/var/lib/postgresql/data
    restart: always

  postgres-sql:
    image: postgres:15
    environment:
      POSTGRES_DB: sqlservicedb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - sqlservice-data:/var/lib/postgresql/data
    restart: always

  # ---------- Artefactik0 ----------
  artefactik0:
    build: ../artefactik0                     # путь к папке с Dockerfile
    ports:
      - "8081:8081"                           # внешний порт 8081 → контейнер 8081
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-artefactik:5432/artefactikdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio-user           # совпадает с MINIO_ROOT_USER из общего minio
      MINIO_SECRET_KEY: minio-password
    depends_on:
      - postgres-artefactik
      - minio
    restart: always

  # ---------- SqlService ----------
  sqlservice:
    build: ../sqlservice
    ports:
      - "8082:8080"                           # внешний порт 8082 → контейнер 8080 (как в sqlservice)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-sql:5432/sqlservicedb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      - postgres-sql
      - kafka
      - minio
    restart: always

  # Остальное без изменений
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    <<: *default-logging
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    <<: *default-logging
    restart: always

  judge0-server:
    image: judge0/judge0:latest
    environment:
      - TMPDIR=/tmp
      - JUDGE0_DISABLE_ISOLATE=1
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: always

  judge0-worker:
    image: judge0/judge0:latest
    environment:
      - TMPDIR=/tmp
      - JUDGE0_DISABLE_ISOLATE=1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: always

  judge0-db:
    image: postgres:16.2
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  judge0-redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: ./judge0/judge0.conf
    <<: *default-logging
    restart: always

  minio:
    image: minio/minio
    container_name: codzilla-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: always

  minio-init:                # ← вот сюда, на уровне других сервисов
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio-user minio-password;
        mc mb --ignore-existing local/artefactik0;
        mc mb --ignore-existing local/sqlservice-tasks;
        echo 'Buckets created';
      "
    restart: on-failure

volumes:
  app-data:
  judge0-data:
  minio-data:
  artefactik-data:     # ← новый
  sqlservice-data:     # ← новый
