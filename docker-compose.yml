  # ─── MinIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: always

  # Создаёт бакеты при первом запуске
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minio-user minio-password;
        mc mb --ignore-existing local/codzilla;
        mc mb --ignore-existing local/artefaktik0;
        mc mb --ignore-existing local/sqlservice-tasks;
        echo 'All buckets ready';
      "
    restart: on-failure

volumes:
  app-data:
  judge0-data:
  minio-data:
  artefactik-data:
  sqlservice-data: